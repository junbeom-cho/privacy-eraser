services:
  project-db:
    image: postgres:18-alpine
    container_name: privacy-protector-db
    environment:
      POSTGRES_DB: privacy_protector
      POSTGRES_USER: privacy
      POSTGRES_PASSWORD: ${PROJECT_DB_PASSWORD:-privacy}
    ports:
      - "5432:5432"
    volumes:
      - project-db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U privacy -d privacy_protector"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  project-db-data:
