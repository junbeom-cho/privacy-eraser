# 앱 + 프로젝트 정보 DB 를 한 번에 띄웁니다.
#
#   cp .env.example .env          # CREDENTIAL_SECRET 을 채웁니다
#   docker compose up -d --build
#   open http://localhost:8080
#
# 프로젝트 정보 DB 는 infra/postgres 정의를 그대로 가져옵니다(include). 한 곳만 고치면 됩니다.
# DB 만 띄우고 앱은 IDE 에서 돌리는 개발 방식은 그대로 쓸 수 있습니다:
#   docker compose -f infra/postgres/docker-compose.yaml --env-file .env up -d
name: privacy-eraser

include:
  - infra/postgres/docker-compose.yaml

services:
  app:
    build: .
    container_name: privacy-eraser-app
    ports:
      - "8080:8080"
    environment:
      # 컨테이너 안에서는 localhost 가 아니라 서비스명으로 붙습니다.
      PROJECT_DB_URL: jdbc:postgresql://project-db:5432/privacy_eraser
      PROJECT_DB_USER: privacy
      PROJECT_DB_PASSWORD: ${PROJECT_DB_PASSWORD:-privacy}

      # 기본값을 두지 않습니다. 없으면 compose 가 여기서 멈춥니다.
      # 이 값이 바뀌면 이미 저장된 raw/edit 비밀번호는 복호화할 수 없습니다.
      CREDENTIAL_SECRET: ${CREDENTIAL_SECRET:?.env 에 CREDENTIAL_SECRET 을 넣으세요}
      # 운영에서는 salt 도 고정해 두세요. 바뀌면 secret 이 같아도 복호화가 깨집니다.
      # CREDENTIAL_SALT: ${CREDENTIAL_SALT}

    # 비식별화 대상 Oracle 이 호스트에서 돌 때 컨테이너에서 닿게 해 줍니다.
    # 프로젝트 접속 정보에는 localhost 대신 이 이름을 넣습니다:
    #   jdbc:oracle:thin:@//host.docker.internal:1521/FREEPDB1
    extra_hosts:
      - "host.docker.internal:host-gateway"

    # Oracle 도 도커로 띄웠다면(infra/oracle) 아래 두 곳의 주석을 풀어 같은 네트워크에 붙입니다.
    # 컨테이너끼리는 이름으로 찾으므로 접속 정보에 컨테이너명을 그대로 씁니다:
    #   jdbc:oracle:thin:@//oracle23ai:1521/FREEPDB1
    # 기본값으로 켜두지 않는 이유는, 그 네트워크가 없으면 compose 가 아예 뜨지 않기 때문입니다.
    # networks: [default, oracle]

    # Flyway 가 시작하자마자 DB 에 붙으므로 준비될 때까지 기다립니다.
    depends_on:
      project-db:
        condition: service_healthy

    restart: unless-stopped

# infra/oracle 은 compose 프로젝트가 따로라 네트워크도 따로입니다. 그 네트워크를 가져다 붙입니다.
# (infra/oracle 의 name: oracle23ai → 네트워크 이름은 oracle23ai_default)
# networks:
#   oracle:
#     name: oracle23ai_default
#     external: true
