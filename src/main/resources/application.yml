spring:
  application:
    name: privacy-eraser

  # 로컬 개발용 시크릿은 gitignore 되는 .env 에 둔다. 파일이 없으면 그냥 무시된다(운영).
  # [.properties] 는 확장자 없는 파일의 형식을 알려주는 것. .env 와 .properties 는 둘 다 KEY=value 라
  # 같은 파일을 docker compose 도 그대로 읽는다.
  config:
    import: optional:file:.env[.properties]

  # 1. 프로젝트 정보 DB(PostgreSQL) - 앱 자체 설정(프로젝트/키워드/정책) 저장소. Flyway 대상은 이 DB 뿐이다.
  # 2. raw_schema / 3. edit_schema(Oracle) 접속정보는 여기 적지 않는다. 프로젝트 레코드에 저장하고 런타임에 연결한다.
  datasource:
    url: ${PROJECT_DB_URL:jdbc:postgresql://localhost:5432/privacy_eraser}
    username: ${PROJECT_DB_USER:privacy}
    # 기본값은 docker-compose.yaml의 기본값과 같아야 한다. 어긋나면 인증 실패가 난다.
    password: ${PROJECT_DB_PASSWORD:privacy}

mybatis:
  mapper-locations: classpath:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true

privacy-eraser:
  # raw/edit 접속 비밀번호 암호화 키의 재료. Argon2id로 AES 키를 파생한다.
  # 둘 중 하나라도 바뀌면 이미 저장된 비밀번호는 복호화할 수 없다. 운영에서는 환경변수로 주입한다.
  credential-secret: ${CREDENTIAL_SECRET}
  credential-salt: ${CREDENTIAL_SALT:privacy-eraser-credential-v1}
