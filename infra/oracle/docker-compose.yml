name: oracle23ai

services:
  oracle:
    image: container-registry.oracle.com/database/free:latest
    container_name: oracle23ai
    ports:
      - "1521:1521"
    environment:
      ORACLE_PWD: ptech6441
    shm_size: "2gb"
    volumes:
      - oracle-data:/opt/oracle/oradata
    healthcheck:
      test: ["CMD-SHELL", "printf 'WHENEVER SQLERROR EXIT 1;\\nselect 1 from dual;\\n' | sqlplus -s -L system/${ORACLE_PWD:-ptech6441}@//localhost:1521/FREEPDB1 > /dev/null"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 45m

volumes:
  oracle-data: